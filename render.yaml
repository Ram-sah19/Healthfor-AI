services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: healthforecast-backend
    runtime: python
    region: oregon
    plan: starter          # upgrade to Standard for always-on (no cold starts)
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      cd backend
      python -m alembic upgrade head

    startCommand: >
      uvicorn --app-dir backend app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2

    healthCheckPath: /health

    envVars:
      # ── Required secrets (set in Render Dashboard → Environment) ─────────────
      - key: SECRET_KEY
        sync: false            # generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"

      - key: DATABASE_URL
        fromDatabase:
          name: healthforecast-postgres
          property: connectionString

      # ── Application settings ──────────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: API_V1_PREFIX
        value: /api/v1

      # ── CORS: the browser origins allowed to call this API ────────────────────
      - key: BACKEND_CORS_ORIGINS
        value: https://healthfor-ai.ram6070246.workers.dev,http://localhost:5173

      # ── JWT ───────────────────────────────────────────────────────────────────
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_MINUTES
        value: "10080"

      # ── ML artifact path ─────────────────────────────────────────────────────
      # The trained model is NOT in the repo - scripts/ci/check_files.py rejects
      # committed artifacts. Until readmission_model.joblib exists at this path on
      # the deployed host, /risk endpoints answer model_loaded=false.
      - key: MODEL_ARTIFACT_DIR
        value: ml/artifacts

      - key: RISK_THRESHOLD_HIGH
        value: "0.20"
      - key: RISK_THRESHOLD_MEDIUM
        value: "0.12"

      # ── MongoDB: optional, leave blank if not using Mongo ────────────────────
      - key: MONGO_URI
        sync: false           # set in Render Dashboard if you need MongoDB Atlas
      - key: MONGO_DB
        value: healthforecast

  # ── Managed PostgreSQL ───────────────────────────────────────────────────────
databases:
  - name: healthforecast-postgres
    region: oregon
    plan: starter            # upgrade to Standard for production SLAs
    databaseName: healthforecast
    user: healthforecast_user
